<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>奶蛙矿工</title>
<meta name="description" content="钩子来回摆动，松手放钩，把金蛙宝物拉上来。手机与电脑均可直接开玩。">
<meta name="theme-color" content="#fff9f1">
<link rel="icon" href="favicon.ico">
<style>
  :root {
    --ink: #4a3325; --ink-soft: #7a6556; --cream: #fff7ec;
    --brand: #ff6b6b; --brand-dark: #e14b4b;
    --gold: #e8a33d; --gold-dark: #b97a1f; --good: #35a06b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 700px at 8% -12%, #ffe9bd 0%, transparent 60%),
      radial-gradient(900px 600px at 104% -6%, #d5f0ff 0%, transparent 55%),
      radial-gradient(1000px 780px at 50% 118%, #ffdbe6 0%, transparent 62%),
      #fff9f1;
    background-attachment: fixed;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    min-height: 100dvh; display: grid; place-items: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  }
  .card {
    width: 100%; max-width: 440px; text-align: center;
    padding: 30px 26px 26px;
    border-radius: 26px;
    background: linear-gradient(180deg, rgba(255,255,255,.97), rgba(255,248,238,.97));
    box-shadow: 0 24px 60px rgba(126, 84, 44, .22), 0 0 0 1px rgba(255,255,255,.8) inset;
    animation: cardIn .4s cubic-bezier(.22, 1, .36, 1);
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }

  /* 主角蛙 */
  .hero {
    width: 116px; height: 116px; margin: 0 auto 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 26%, #fff 0%, #ffe6a8 76%);
    box-shadow: 0 0 0 1px rgba(126,84,44,.16) inset, 0 8px 22px rgba(126,84,44,.2);
    overflow: hidden; display: grid; place-items: center;
  }
  .hero img { width: 116%; height: 116%; object-fit: contain; }

  /* 大标题 */
  .title {
    margin: 0; font-size: 44px; font-weight: 800; letter-spacing: .06em; line-height: 1.1;
    background: linear-gradient(100deg, #ffb347, #ff7a59 50%, #e14b4b);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle {
    margin: 8px 0 0; font-size: 14px; letter-spacing: .03em; color: var(--ink-soft);
  }

  /* 简介 */
  .intro {
    margin: 18px 0 0; padding: 14px 16px;
    border-radius: 14px; background: rgba(126,84,44,.06);
    text-align: left;
  }
  .intro h2 {
    margin: 0 0 8px; font-size: 12px; font-weight: 800; letter-spacing: .16em;
    color: var(--ink-soft); text-align: center;
  }
  .intro ul { list-style: none; margin: 0; padding: 0; }
  .intro li {
    position: relative; padding: 5px 0 5px 20px;
    font-size: 13.5px; line-height: 1.6; color: var(--ink);
  }
  .intro li::before {
    content: ''; position: absolute; left: 2px; top: 12px;
    width: 8px; height: 8px; border-radius: 50%;
    background: linear-gradient(135deg, #ffb347, #e8912a);
  }
  .intro li b { color: var(--gold-dark); font-weight: 700; }
  .intro li .bad { color: var(--brand-dark); }

  /* 进入按钮 */
  .enter {
    display: block; width: 100%; margin-top: 22px;
    font: inherit; font-size: 18px; font-weight: 800; letter-spacing: .08em;
    padding: 14px 18px; border: 0; border-radius: 16px; cursor: pointer;
    text-decoration: none; color: #fff;
    background: linear-gradient(135deg, #ff8a5b, #ff4d6d 55%, #e14b4b);
    box-shadow: 0 12px 26px rgba(225, 75, 75, .32);
    transition: transform .18s cubic-bezier(.22, 1, .36, 1), box-shadow .18s;
  }
  .enter:hover { box-shadow: 0 16px 32px rgba(225, 75, 75, .4); }
  .enter:active { transform: scale(.98); }
  .enter:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
  .enter.big { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }

  .foot {
    margin: 16px 0 0; font-size: 11px; line-height: 1.6; color: var(--ink-soft);
  }
  .foot a { color: inherit; }

  @media (max-width: 360px) {
    .title { font-size: 38px; }
    .card { padding: 26px 20px 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .enter.big { animation: none !important; }
  }

  /* 难度选择 */
  .pick {
    display: flex; align-items: stretch; gap: 8px;
    margin-top: 22px; padding: 10px 12px;
    border-radius: 14px; background: rgba(126,84,44,.05);
  }
  .pick-label {
    align-self: center; font-size: 12px; font-weight: 800; letter-spacing: .14em;
    color: var(--ink-soft);
  }
  .pick button {
    flex: 1; font: inherit; font-size: 14px; font-weight: 700;
    padding: 9px 4px; border: 1.5px solid rgba(126,84,44,.22); border-radius: 11px;
    background: #fff; color: var(--ink); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    transition: transform .14s, border-color .14s, box-shadow .14s, background .14s;
  }
  .pick button b { font-size: 11px; font-weight: 800; color: var(--gold-dark); }
  .pick button.on {
    border-color: var(--brand); background: linear-gradient(180deg,#fff,#fff2ee);
    box-shadow: 0 6px 16px rgba(225,75,75,.18);
  }
  .pick button.on b { color: var(--brand-dark); }
  .pick button:active { transform: scale(.97); }
  .pick-note {
    margin: 8px 0 0; font-size: 11.5px; color: var(--ink-soft); line-height: 1.5;
  }

  /* 排行榜 */
  .board {
    margin-top: 20px; padding: 14px 14px 8px;
    border-radius: 14px; background: rgba(126,84,44,.05); text-align: left;
  }
  .board-head {
    display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px;
  }
  .board-head h2 {
    margin: 0; font-size: 13px; font-weight: 800; letter-spacing: .14em; color: var(--ink);
  }
  .board-tag {
    font-size: 10.5px; font-weight: 700; color: var(--gold-dark);
    background: rgba(232,163,61,.16); padding: 2px 8px; border-radius: 999px;
  }
  .board-list { list-style: none; margin: 0; padding: 0; }
  .board-row, .board-tip {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; padding: 6px 2px; border-bottom: 1px dashed rgba(126,84,44,.14);
  }
  .board-list li:last-child { border-bottom: 0; }
  .board-tip { color: var(--ink-soft); justify-content: center; font-size: 12px; padding: 10px 2px; }
  .board-row .rk { width: 20px; text-align: center; font-weight: 800; color: var(--ink-soft); flex: 0 0 auto; }
  .board-row .rk-1, .board-row .rk-2, .board-row .rk-3 { color: var(--gold-dark); }
  .board-row .nm {
    flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600;
  }
  .board-row .sc { font-weight: 800; color: var(--brand-dark); flex: 0 0 auto; }
  .board-row .pr {
    flex: 0 0 auto; font-size: 10.5px; color: var(--ink-soft);
    background: rgba(126,84,44,.08); padding: 1px 6px; border-radius: 999px;
  }

  @media (max-width: 360px) {
    .pick-label { display: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <main class="card">
      <div class="hero">
        <img src="assets/nai/nai02-stand.webp" alt="奶蛙矿工">
      </div>
      <h1 class="title">奶蛙矿工</h1>
      <p class="subtitle">钩子左右摆，松手放钩</p>

      <section class="intro">
        <h2>怎么玩</h2>
        <ul>
          <li>钩子来回摆动，<b>点一下</b>松手放钩，把金蛙和宝物拉上来。</li>
          <li>金蛙、宝箱、钻石越重越值钱；<span class="bad">炸弹</span>拉到会扣分、断连击。</li>
          <li>限时内达到目标分即可收工，分数越高段位越高。</li>
          <li>过关赚<b>奶蛙币</b>，小卖部换增益，换一局清零。</li>
        </ul>
      </section>

      <section class="pick" id="pick" role="group" aria-label="选择难度">
        <span class="pick-label">难度</span>
        <button type="button" data-preset="relaxed">轻松<b>×1</b></button>
        <button type="button" data-preset="standard" class="on">标准<b>×2</b></button>
        <button type="button" data-preset="hard">硬核<b>×3</b></button>
      </section>
      <p class="pick-note">难度越高，摆钩更快、挣脱更凶，结算分 × 倍率</p>

      <a class="enter big" id="startBtn" href="miner/?preset=standard">开始游戏</a>

      <section class="board" id="board">
        <div class="board-head">
          <h2>排行榜</h2>
          <span class="board-tag" id="boardTag">总分榜</span>
        </div>
        <ol class="board-list" id="boardList">
          <li class="board-tip">榜单加载中…</li>
        </ol>
      </section>

      <p class="foot">手机与电脑均可直接开玩 · 竖屏体验最佳</p>
    </main>
  </div>

  <script src="miner/cloud.js"></script>
  <script>
  (function () {
    var pick = document.getElementById('pick');
    var startBtn = document.getElementById('startBtn');
    var boardList = document.getElementById('boardList');
    var PRESET = {
      relaxed:  { label: '轻松', factor: 1 },
      standard: { label: '标准', factor: 2 },
      hard:     { label: '硬核', factor: 3 }
    };

    function fmt(n) { return String(Math.floor(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    /* 选难度 → 同时点亮按钮、改写进入按钮的 ?preset= */
    function selectPreset(p) {
      Array.prototype.forEach.call(pick.querySelectorAll('button[data-preset]'), function (b) {
        b.classList.toggle('on', b.getAttribute('data-preset') === p);
      });
      startBtn.setAttribute('href', 'miner/?preset=' + p);
    }
    pick.addEventListener('click', function (ev) {
      var b = ev.target.closest ? ev.target.closest('button[data-preset]') : null;
      if (b) { selectPreset(b.getAttribute('data-preset')); }
    });

    /* 内嵌只读排行榜：只取云端总分榜前若干名，纯展示，不写库 */
    function renderBoard(rows) {
      if (!rows || !rows.length) {
        boardList.innerHTML = '<li class="board-tip">还没有人上榜，快来抢第一！</li>';
        return;
      }
      boardList.innerHTML = rows.map(function (r, i) {
        var m = PRESET[r.preset] || PRESET.standard;
        return '<li class="board-row">' +
          '<span class="rk rk-' + (i + 1) + '">' + (i + 1) + '</span>' +
          '<span class="nm">' + esc(r.name || '无名氏') + '</span>' +
          '<span class="sc">' + fmt(r.score) + '</span>' +
          '<span class="pr">' + m.label + '×' + m.factor + '</span>' +
          '</li>';
      }).join('');
    }

    function loadBoard() {
      if (!window.MinerCloud || !MinerCloud.available()) {
        boardList.innerHTML = '<li class="board-tip">排行榜需在发布后的域名下查看</li>';
        return;
      }
      MinerCloud.load(10).then(function (res) {
        renderBoard((res && res.rows && res.rows.score) || []);
      }).catch(function () {
        boardList.innerHTML = '<li class="board-tip">榜单暂时打不开，稍后再试</li>';
      });
    }

    loadBoard();
  })();
  </script>
</body>
</html>
