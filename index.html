<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>奶蛙小游戏</title>
<meta name="description" content="大家都玩过的国民小游戏，全部换成奶蛙皮肤。第一款：奶蛙矿工。">
<meta name="theme-color" content="#fff9f1">
<meta property="og:type" content="website">
<meta property="og:title" content="奶蛙小游戏">
<meta property="og:description" content="大家都玩过的国民小游戏，全部换成奶蛙皮肤。点开就能玩，手机和电脑都行。">
<link rel="icon" href="favicon.ico">
<style>
  :root {
    --ink: #4a3325;
    --ink-soft: #7a6556;
    --brand: #ff6b6b;
    --brand-dark: #e14b4b;
    --card: rgba(255, 255, 255, .76);
    --shadow: 0 18px 50px rgba(126, 84, 44, .18);
    --ease-out: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(1200px 700px at 8% -12%, #ffe9bd 0%, transparent 60%),
      radial-gradient(900px 600px at 104% -6%, #d5f0ff 0%, transparent 55%),
      radial-gradient(1000px 780px at 50% 118%, #ffdbe6 0%, transparent 62%),
      #fff9f1;
    background-attachment: fixed;
    padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 880px; margin: 0 auto; }

  /* ---------- 头部 ---------- */
  .hero { display: flex; align-items: center; gap: 20px; padding: 40px 4px 22px; }
  .hero-mascot { position: relative; flex: 0 0 auto; width: 108px; height: 108px; }
  .hero-mascot img {
    width: 100%; height: 100%; object-fit: contain;
    transform-origin: 50% 85%; animation: giggle .9s ease-in-out infinite;
  }
  .bubble {
    position: absolute; left: -2px; top: -28px; white-space: nowrap;
    padding: 5px 11px; border-radius: 14px 14px 14px 4px;
    background: #fff; color: var(--brand-dark); font-size: 13px; font-weight: 700;
    box-shadow: 0 6px 16px rgba(126, 84, 44, .16);
  }
  h1 {
    margin: 0; font-size: clamp(28px, 6vw, 40px); letter-spacing: .04em; line-height: 1.15;
    background: linear-gradient(100deg, #ff7a59, #ff4d6d 55%, #b13bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p { margin: 8px 0 0; font-size: 15px; line-height: 1.6; color: var(--ink-soft); }

  /* ---------- 卡片 ---------- */
  .grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  /* 当前只上架一款：单卡居中，别让它在大屏上缩成半列 */
  .grid.solo { max-width: 560px; margin: 0 auto; }
  @media (min-width: 640px) { .grid.solo { grid-template-columns: 1fr; } }
  .card {
    display: flex; flex-direction: column; overflow: hidden; text-decoration: none; color: inherit;
    border-radius: 24px; border: 1px solid rgba(255, 255, 255, .8);
    background: var(--card); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    box-shadow: var(--shadow);
    transition: transform .35s var(--ease-out), box-shadow .35s var(--ease-out);
  }
  a.card:hover { transform: translateY(-5px); box-shadow: 0 26px 60px rgba(126, 84, 44, .26); }
  a.card:active { transform: translateY(0) scale(.985); transition-duration: .1s; }
  a.card:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
  .card.soon { opacity: .74; }

  .art { position: relative; height: 186px; overflow: hidden; }
  .meta { display: flex; flex-direction: column; gap: 6px; padding: 16px 18px 18px; flex: 1; }
  .meta h2 { margin: 0; font-size: 22px; letter-spacing: .03em; }
  .orig {
    align-self: flex-start; margin: 0; padding: 2px 10px; border-radius: 99px;
    font-size: 12px; font-weight: 600; color: var(--brand-dark); background: rgba(255, 107, 107, .12);
  }
  .meta p.desc { margin: 2px 0 0; font-size: 14px; line-height: 1.6; color: var(--ink-soft); }
  .go {
    align-self: flex-end; margin-top: 10px; padding: 8px 16px; border-radius: 14px;
    font-size: 13.5px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #ff8a5b, var(--brand) 55%, var(--brand-dark));
    box-shadow: 0 8px 18px rgba(225, 75, 75, .28);
  }
  .soon-tag {
    align-self: flex-end; margin-top: 10px; padding: 8px 16px; border-radius: 14px;
    font-size: 13px; font-weight: 700; color: var(--ink-soft); background: rgba(126, 84, 44, .1);
  }

  /* ---------- 矿工卡片的小场景 ---------- */
  .art-miner { background: linear-gradient(#ffd7a0 0%, #ffeccb 46%, #fff8ec 46%); }
  .art-miner .dirt {
    position: absolute; left: 0; right: 0; bottom: 0; height: 54%;
    background: linear-gradient(#d9a468, #bb7f48 45%, #7f5029);
  }
  .art-miner .grass {
    position: absolute; left: 0; right: 0; bottom: calc(54% - 5px); height: 7px;
    background: linear-gradient(#9ed471, #69a94a);
  }
  .art-miner .rope {
    position: absolute; left: 50%; top: 44%;
    width: 2.5px; height: 40px; margin-left: -1.25px;
    background: linear-gradient(#8d6a45, #6b4a2f);
    transform-origin: 50% 0; animation: sway 2.6s ease-in-out infinite;
  }
  .art-miner .hook {
    position: absolute; left: 50%; top: calc(44% + 38px); width: 20px; height: 14px;
    margin-left: -10px; border: 3.5px solid #6f7681; border-top: 0;
    border-radius: 0 0 12px 12px;
    animation: sway 2.6s ease-in-out infinite;
  }
  .art-miner .miner {
    position: absolute; left: 50%; bottom: 46%; width: 96px; margin-left: -48px;
    transform-origin: 50% 92%; animation: bob 2.1s ease-in-out infinite;
  }
  /* 封面里的小物件：不垫彩色方块，只留本体。
     土层是深棕，立绘偏浅色，加一层贴合轮廓的投影就够看清了。 */
  .art-miner .booty {
    position: absolute; display: grid; place-items: center;
  }
  .art-miner .booty img {
    width: 82%; height: 82%; object-fit: contain;
    filter: drop-shadow(0 2px 3px rgba(60, 42, 26, .38));
  }
  .art-miner .b1 { left: 22px; bottom: 16px; width: 46px; height: 46px; }
  .art-miner .b2 { left: 78px; bottom: 34px; width: 40px; height: 40px; }
  .art-miner .b3 { right: 26px; bottom: 20px; width: 52px; height: 52px; }
  .art-miner .b4 { right: 88px; bottom: 44px; width: 38px; height: 38px; }

  /* ---------- 待开发卡片的小场景 ---------- */
  .art-future { background: linear-gradient(160deg, #e8dcff, #d5f0ff); }
  .art-future .ghost {
    position: absolute; left: 50%; top: 50%; width: 92px; margin: -46px 0 0 -46px;
    opacity: .3; filter: saturate(.5);
    animation: bob 2.6s ease-in-out infinite;
  }
  .art-future .dash {
    position: absolute; inset: 24px; border: 2.5px dashed rgba(122, 101, 86, .34);
    border-radius: 18px;
  }

  /* ---------- 底部 ---------- */
  footer { margin-top: 26px; text-align: center; font-size: 12.5px; line-height: 1.8; color: var(--ink-soft); }
  footer a { color: inherit; }

  @keyframes giggle { 0%, 100% { transform: rotate(-4deg) scale(1); } 50% { transform: rotate(4deg) scale(1.04, .97); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes sway { 0%, 100% { transform: rotate(-16deg); } 50% { transform: rotate(16deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

  @media (max-width: 520px) {
    .hero { gap: 14px; }
    .hero-mascot { width: 86px; height: 86px; }
    .bubble { font-size: 12px; top: -26px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="hero-mascot" aria-hidden="true">
      <img src="assets/nai/nai10-laugh.webp" alt="">
      <span class="bubble">哦齁齁齁～</span>
    </div>
    <div>
      <h1>奶蛙小游戏</h1>
      <p>把大家都玩过的国民小游戏换成奶蛙皮肤。第一款先上矿工，点开就能玩，手机和电脑都行。</p>
    </div>
  </header>

  <main class="grid solo">

    <a class="card" href="miner/index.html">
      <div class="art art-miner" aria-hidden="true">
        <div class="dirt"></div>
        <div class="grass"></div>
        <div class="booty b1"><img src="assets/nai/nai05-dog.webp" alt=""></div>
        <div class="booty b2"><img src="assets/nai/nai07-rabbit.webp" alt=""></div>
        <div class="booty b3"><img src="assets/nai/nai08-sumo.webp" alt=""></div>
        <div class="booty b4"><img src="assets/nai/nai06-horse.webp" alt=""></div>
        <div class="rope"></div>
        <div class="hook"></div>
        <img class="miner" src="assets/nai/nai02-stand.webp" alt="">
      </div>
      <div class="meta">
        <h2>奶蛙矿工</h2>
        <p class="orig">玩法同款：黄金矿工</p>
        <p class="desc">钩子来回摆，看准了松手。越大越值钱也越重；天使是炸弹别碰，大块头会挣扎脱钩。</p>
        <span class="go">开玩 →</span>
      </div>
    </a>

  </main>

  <footer>
    奶蛙是网络梗 · 本项目仅供学习娱乐，不作商用<br>
    立绘取自 <a href="https://yhsome.github.io/BigNaiWa/" target="_blank" rel="noopener">《合成大奶娃》</a>，版权归原作者所有
  </footer>
</div>
</body>
</html>
