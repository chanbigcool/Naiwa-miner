# GitHub Pages 的发布分支是 gh-pages，而日常开发提交在 main。
# 本工作流在每次推送 main 之后，把 main 整体镜像到 gh-pages，两者不会漂移。
#
# 分支同步与站点启用是两件事：这个工作流只保证 gh-pages 与 main 不漂移，
# 它本身不会开启 Pages 站点。站点需在 Settings → Pages 选一次发布源
# （Source: Deploy from a branch, 分支 gh-pages, 目录 / (root)），开完即长期有效。
#
# 若 Actions 不可用，手动同步等价于：
#   git push --force origin main:gh-pages

name: Sync Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror main to gh-pages
        run: git push --force origin HEAD:gh-pages
