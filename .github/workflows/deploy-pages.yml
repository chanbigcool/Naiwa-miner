name: Deploy Pages

# 把仓库根目录直接发布到 GitHub Pages。
# 与 sync-pages.yml 的区别：那个是把 main 镜像到 gh-pages 分支（旧机制，需要
# 在设置页把 Pages 来源选成 gh-pages）；这个是官方推荐机制，同样在设置页，
# 但来源选 GitHub Actions，且 configure-pages 会尝试自动建站，无需手工点击。
# 两者只需保留一个，Pages 来源选定后请把另一个删掉。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 启用 Pages（若尚未启用）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
