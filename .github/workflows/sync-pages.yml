# GitHub Pages 的发布分支是 gh-pages，而日常开发提交在 main。
# 本工作流在每次推送 main 之后，把 main 整体镜像到 gh-pages，两者不会漂移。
#
# 之所以用「推 gh-pages 分支」而不是在设置页选 main 作为发布源：
# 推送 gh-pages 会自动开启 Pages 站点，无需任何人工设置。
#
# 若 Actions 不可用，手动同步等价于：
#   git push --force origin main:gh-pages

name: Sync Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror main to gh-pages
        run: git push --force origin HEAD:gh-pages
